# PipeWire configuration file to route system stereo audio to a dual-monitor setup
# with a custom 4-channel panning layout using combine-stream and two filter-chains.
#
# Layout:
# - Left Monitor (HDMI natively, pro-output-3), Left Speaker: Left Channel only
# - Left Monitor (HDMI natively, pro-output-3), Right Speaker: Mono (Left + Right blended)
# - Right Monitor (DP Adapter, pro-output-7), Left Speaker: Mono (Left + Right blended)
# - Right Monitor (DP Adapter, pro-output-7), Right Speaker: Right Channel only

context.modules = [
    # Left Monitor Filter Sink
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "Left Monitor Filter Sink"
          media.name       = "Left Monitor Filter Sink"
          filter.graph = {
              nodes = [
                  { type = builtin name = copy_L label = copy }
                  { type = builtin name = copy_R label = copy }
                  { type = builtin name = mixer_L label = mixer control = { "Gain 1" = 1.0 } }
                  { type = builtin name = mixer_R label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
              ]
              inputs = [ "copy_L:In" "copy_R:In" ]
              links = [
                  # L input to L output (mixer_L)
                  { output = "copy_L:Out" input = "mixer_L:In 1" }
                  # L and R inputs to R output (mixer_R)
                  { output = "copy_L:Out" input = "mixer_R:In 1" }
                  { output = "copy_R:Out" input = "mixer_R:In 2" }
              ]
              outputs = [ "mixer_L:Out" "mixer_R:Out" ]
          }
          capture.props = {
              node.name      = "left_monitor_sink"
              media.class    = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name      = "left_monitor_playback"
              node.target    = "alsa_output.pci-0000_01_00.1.pro-output-3"
              audio.position = [ AUX0 AUX1 ]
          }
      }
    }

    # Right Monitor Filter Sink
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "Right Monitor Filter Sink"
          media.name       = "Right Monitor Filter Sink"
          filter.graph = {
              nodes = [
                  { type = builtin name = copy_L label = copy }
                  { type = builtin name = copy_R label = copy }
                  { type = builtin name = mixer_L label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                  { type = builtin name = mixer_R label = mixer control = { "Gain 1" = 1.0 } }
              ]
              inputs = [ "copy_L:In" "copy_R:In" ]
              links = [
                  # L and R inputs to L output (mixer_L)
                  { output = "copy_L:Out" input = "mixer_L:In 1" }
                  { output = "copy_R:Out" input = "mixer_L:In 2" }
                  # R input to R output (mixer_R)
                  { output = "copy_R:Out" input = "mixer_R:In 1" }
              ]
              outputs = [ "mixer_L:Out" "mixer_R:Out" ]
          }
          capture.props = {
              node.name      = "right_monitor_sink"
              media.class    = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name      = "right_monitor_playback"
              node.target    = "alsa_output.pci-0000_01_00.1.pro-output-7"
              audio.position = [ AUX0 AUX1 ]
          }
      }
    }

    # Combined Sink for System Audio
    { name = libpipewire-module-combine-stream
      args = {
          combine.mode = sink
          node.name = "dual_monitor_sink"
          node.description = "Dual Monitor Combined Sink"
          combine.props = {
              audio.position = [ FL FR ]
          }
          stream.rules = [
              { matches = [ { node.name = "left_monitor_sink" } ]
                actions = { create-stream = { audio.position = [ FL FR ] } }
              }
              { matches = [ { node.name = "right_monitor_sink" } ]
                actions = { create-stream = { audio.position = [ FL FR ] } }
              }
          ]
      }
    }
]
